}}
:root[data-theme="dark"]{

  --line:#293642; --brand:#79AEDA; --brand-ink:#0A1620; --brand-soft:#1D3345;

  --hivis-soft:#3A2F0C; --ok:#52C58E; --ok-soft:#173527; --warn:#E6AD4B; --warn-soft:#3A2C12; --bad:#F2806F; --bad-soft:#3E1C19;

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px} h2{font-size:21px} h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px;gap:18px}

.nav{display:flex;flex-direction:column;gap:2px}

.content{min-width:0;display:flex;flex-direction:column}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:26px 28px 6px}

.page{padding:16px 28px 48px;display:flex;flex-direction:column;gap:18px}
.mtop{display:none}
.bottomnav{display:none}
@media (max-width:900px){

  .mtop .logo{padding:0;font-size:20px}
  .mtop select{margin-left:auto;background:var(--side-soft);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:9px;padding:7px 8px;font-weight:600;max-width:55%}
  .phead{padding:18px 16px 4px}

}

/* building blocks */
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}

.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:13px}
.eyebrow{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}

@media (max-width:1100px){.g-main{grid-template-columns:1fr}}
@media (max-width:760px){.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.g-2{grid-template-columns:1fr}}
.kpi{padding:16px}

.kpi.alert .v{color:var(--bad)}
.kpi.good .v{color:var(--ok)}
@media (max-width:760px){.kpi .v{font-size:25px}.kpi{padding:13px}}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.go{background:var(--hivis);border-color:var(--hivis);color:var(--hivis-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.xl{padding:15px 22px;font-size:18px;border-radius:13px;font-family:var(--display);letter-spacing:.02em}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--hivis);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}

.empty{padding:22px;text-align:center;color:var(--ink-3)}

.avs{display:flex}.avs .av+.av{margin-left:-7px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 2px;border-top:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;flex-wrap:wrap}
.li:first-child{border-top:0}
button.li{cursor:pointer} button.li:hover{background:var(--surface-2)}
.li .grow{flex:1;min-width:170px}
.li .t{font-weight:600}
.meter{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line);margin-top:8px}

/* job cards */
.jc{display:grid;grid-template-columns:74px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}

.stack{display:flex;flex-direction:column;gap:10px}
.att{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}

.tabs button[aria-pressed="true"] i{background:var(--hivis);color:var(--hivis-ink)}
.appl{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--hivis);color:var(--hivis-ink);white-space:nowrap}
.prof{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px}

.prof-h .av{width:48px;height:48px;font-size:17px}

.badges{display:flex;gap:6px;flex-wrap:wrap}
.pstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--surface-2);border-radius:12px;padding:10px 6px;text-align:center}

.pstats span{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.quote{background:var(--brand-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days span{font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--surface-2);color:var(--ink-3)}

.daypick{display:flex;gap:6px;flex-wrap:wrap}

.daypick span{display:inline-block;padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px}
.daypick input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.daypick input:focus-visible+span{outline:2px solid var(--hivis)}

.wstep{font-size:13px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.wq{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;width:max-content}
.stepper button{border:0;background:transparent;width:46px;height:44px;font-size:22px;font-weight:700;cursor:pointer;color:var(--brand)}
.stepper b{min-width:44px;text-align:center;font-family:var(--display);font-size:22px}
.vis{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.vis:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.vis input{accent-color:var(--brand);width:18px;height:18px;margin-top:3px}
.vis .grow{flex:1;min-width:0}
.est{border-radius:16px;padding:14px 16px;background:linear-gradient(150deg,#13293B,#1C4B6E);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}
.est b{font-family:var(--display);font-size:30px}
.est span{font-size:13px;opacity:.85}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.favbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.favbtn[aria-pressed="true"]{background:var(--hivis-soft);border-color:var(--hivis);color:var(--warn)}
.morelist{display:flex;flex-direction:column;gap:8px}
.morelist button{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;cursor:pointer;text-align:left}
.morelist button svg{width:22px;height:22px;color:var(--brand)}
.morelist .badge{margin-left:auto;background:var(--hivis);color:var(--hivis-ink);border-radius:999px;font-size:12px;padding:1px 8px}
.ccard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 2px;border:0;border-top:1px solid var(--line);background:transparent;width:100%;text-align:left;cursor:pointer}
.ccard:first-child{border-top:0}
.ccard .sub4{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;font-size:12px;color:var(--ink-3)}
.ccard .sub4 b{display:block;color:var(--ink);font-size:14px;font-family:var(--mono)}
@media (max-width:1100px){.bday.empty{padding:6px 10px;align-items:center}.bday.empty .bdh .dd{font-size:18px}.bday.empty .bdh{flex-direction:row;gap:6px;align-items:baseline}.bday.empty .addday{justify-self:end;padding:5px 12px}}
.teaser .tasks{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
@media (max-width:640px){.teaser .tasks{grid-template-columns:1fr}}
.jc .t .appl{margin-left:4px}
.hired-note{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-weight:700}

/* ===== v6: Truckle brand ===== */
:root{--navy:#0B1C2B;--navy2:#13304A;--navy3:#1C4B6E;--gold:#F4B000;--gold2:#FFCB3D;--gold-ink:#0B1C2B;--eyebrow:#A87700;
  --bg:#EFF2F6;--brand:#153E5E;--side:#0B1C2B;--side-soft:#16324A;--band-h:250px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--eyebrow:#F4B000;--brand:#8DBFE6}}
:root[data-theme="dark"]{--eyebrow:#F4B000;--brand:#8DBFE6}
body{background:var(--navy)}
.app{background:var(--bg)}
.eyebrow{color:var(--eyebrow);letter-spacing:.12em;font-weight:700}
/* logo */
.logo{gap:10px;font-family:var(--display);letter-spacing:-.01em}
.logo .mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#FFD35C,#F4B000 55%,#D99A00);box-shadow:0 6px 16px rgba(244,176,0,.28),inset 0 1px 0 rgba(255,255,255,.5);display:grid;place-items:center}
.wm{font-size:25px;font-weight:600;color:#fff;letter-spacing:-.01em;line-height:1}
.wm b{font-weight:700;color:var(--gold)}
.mtop .logo .mark{width:32px;height:32px;border-radius:10px}
.mtop .wm{font-size:22px}.mtop select{flex:1;min-width:0;max-width:none;margin-left:6px}.mtop .logo{flex:none}
/* sidebar */
.side{background:radial-gradient(120% 40% at 0% 0%,rgba(244,176,0,.10),rgba(244,176,0,0) 60%),linear-gradient(180deg,#0B1C2B 0%,#0E2437 100%);border-right:1px solid rgba(244,176,0,.10);padding:22px 14px}
.who label{color:rgba(255,255,255,.55)}
.who select{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12)}
.nav button{color:#B9C7D3;border-radius:12px;padding:11px 12px;transition:background .15s,color .15s}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"]{background:linear-gradient(90deg,rgba(244,176,0,.20),rgba(244,176,0,.04));color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav button[aria-current="page"] svg{color:var(--gold)}
.side .foot{opacity:1;color:rgba(255,255,255,.5);line-height:1.5}
.side .foot b{display:block;color:#fff;font-family:var(--display);font-size:15px;letter-spacing:.01em;margin-bottom:2px}
.side .foot b i{font-style:normal;color:var(--gold)}
.bell{background:rgba(255,255,255,.07)}
/* navy header band */
.content{position:relative;background:linear-gradient(180deg,var(--navy) 0,var(--navy2) calc(var(--band-h) - 40px),var(--navy2) var(--band-h),var(--bg) var(--band-h)) no-repeat}
.content::before{content:"";position:absolute;right:-120px;top:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(closest-side,rgba(244,176,0,.16),rgba(244,176,0,0));pointer-events:none}
.content::after{content:"";position:absolute;right:40px;top:40px;width:260px;height:160px;pointer-events:none;opacity:.10;background:repeating-linear-gradient(135deg,#F4B000 0 2px,transparent 2px 14px);-webkit-mask:radial-gradient(closest-side,#000,transparent);mask:radial-gradient(closest-side,#000,transparent)}
.content{overflow-x:clip}.phead,.page{position:relative;z-index:1}
.phead h1{color:#fff;font-size:34px;letter-spacing:-.005em}
.phead .sub{color:rgba(255,255,255,.72)}
.phead .btn:not(.go){background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff}
.phead .btn:not(.go):hover{background:rgba(255,255,255,.18)}
.page>.note:first-child{background:rgba(255,255,255,.1);color:rgba(255,255,255,.8)}
/* cards */
.card{border:0;border-radius:20px;box-shadow:0 1px 2px rgba(11,28,43,.05),0 10px 30px rgba(11,28,43,.07)}
.kpi .v{letter-spacing:-.01em}
.card-h h2,.card>h2{letter-spacing:-.005em}
/* buttons */
.btn{border-radius:12px;transition:transform .12s,box-shadow .2s,background .15s}
.btn:active{transform:scale(.98)}
.btn.go{background:linear-gradient(180deg,#FFC62A,#F4B000);border-color:#E7A600;color:var(--gold-ink);box-shadow:0 6px 16px rgba(244,176,0,.28),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.primary{background:linear-gradient(180deg,#1A456A,#13304A);border-color:#13304A;color:#fff}
.btn.mega.go{background:linear-gradient(180deg,#FFC62A,#F4B000)}
/* heros sit on the band */
.hx{background:radial-gradient(90% 80% at 100% 0%,rgba(244,176,0,.30),rgba(244,176,0,0) 55%),linear-gradient(150deg,#16395A 0%,#1F5783 100%);box-shadow:0 0 0 1px rgba(244,176,0,.22),0 22px 44px rgba(3,12,20,.35)}
.hx .big{color:#fff}
.hx .lbl{color:var(--gold2)}
/* drawer */
.dhead{background:linear-gradient(180deg,var(--navy),var(--navy2));border-bottom:2px solid var(--gold);color:#fff}
.dhead h2{color:#fff}
.dhead .btn.ghost{color:#fff}
.scrim{background:rgba(6,14,22,.55);backdrop-filter:blur(3px)}
/* job-board cards */
.task{border:0;border-radius:20px;box-shadow:0 1px 2px rgba(11,28,43,.05),0 10px 28px rgba(11,28,43,.08);overflow:hidden}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#FFD35C,#F4B000)}
.tprice{color:var(--navy2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tprice{color:var(--gold)}}
.tabs button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.tabs button[aria-pressed="true"] i{background:var(--navy);color:#fff}
.tabs button{border:0;background:rgba(255,255,255,.95)}
.seg button[aria-pressed="true"]{background:var(--navy2);color:#fff}
.est{background:radial-gradient(90% 90% at 100% 0%,rgba(244,176,0,.28),rgba(244,176,0,0) 60%),linear-gradient(150deg,#0B1C2B,#1C4B6E)}
.wprog i.on{background:linear-gradient(90deg,#FFD35C,#F4B000)}
.appl{background:linear-gradient(180deg,#FFC62A,#F4B000)}
/* mobile top + bottom nav */
@media (max-width:900px){
  :root{--band-h:215px}
  .mtop{background:var(--navy);padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
  .mtop select{background:rgba(255,255,255,.08)}
  .phead{padding:16px 16px 6px}.phead h1{font-size:30px}
  .content::after{display:none}
  .bottomnav{background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:0;box-shadow:0 -8px 30px rgba(11,28,43,.10);border-radius:22px 22px 0 0;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));align-items:flex-end}
  .bottomnav button{color:#6B7A88;font-size:11px;gap:4px}
  .bottomnav button svg{width:24px;height:24px;padding:3px 10px;box-sizing:content-box;border-radius:999px;transition:background .2s}
  .bottomnav button[aria-current="page"]{color:var(--navy)}
  .bottomnav button[aria-current="page"] svg{background:linear-gradient(180deg,#FFD35C,#F4B000);color:var(--navy)}
  .bottomnav .fab{flex:1.1;color:var(--navy);font-weight:700}
  .bottomnav .fab .fb{width:58px;height:58px;border-radius:20px;margin-top:-30px;display:grid;place-items:center;background:linear-gradient(145deg,#FFD35C,#F4B000 55%,#DB9C00);box-shadow:0 10px 24px rgba(244,176,0,.45),0 0 0 5px #fff;color:var(--navy)}
  .bottomnav .fab .fb svg{width:28px;height:28px;padding:0;background:none}
  .bottomnav .fab.live .fb{background:linear-gradient(145deg,#52C58E,#1D7648);color:#fff;box-shadow:0 10px 24px rgba(29,118,72,.4),0 0 0 5px #fff;animation:pulseg 1.8s infinite}
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bottomnav{background:rgba(22,31,40,.97)}:root:not([data-theme="light"]) .bottomnav .fab .fb{box-shadow:0 10px 24px rgba(244,176,0,.3),0 0 0 5px #161F28}:root:not([data-theme="light"]) .bottomnav button[aria-current="page"]{color:#fff}}
/* invoice paper brand */
.pbrand{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid #E1E6EB;font-size:12px;color:#77838F}
.pbrand .mk{width:18px;height:18px;border-radius:5px;background:#F4B000;display:grid;place-items:center}
.pbrand b{color:#0B1C2B;font-family:var(--display);font-size:14px}.pbrand b i{font-style:normal;color:#C48A00}
/* splash */
#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(60% 50% at 50% 38%,rgba(244,176,0,.20),rgba(244,176,0,0) 70%),linear-gradient(160deg,#0B1C2B,#13304A 60%,#0B1C2B);transition:opacity .45s ease,transform .45s ease}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.sp{display:flex;flex-direction:column;align-items:center;gap:14px}
.sp-mark{width:92px;height:92px;border-radius:28px;display:grid;place-items:center;background:linear-gradient(145deg,#FFD35C,#F4B000 55%,#D99A00);box-shadow:0 20px 50px rgba(244,176,0,.35),inset 0 1px 0 rgba(255,255,255,.5);animation:spPop .6s cubic-bezier(.2,.9,.3,1.3) both}
.sp-mark svg{animation:spDrive .7s .15s cubic-bezier(.2,.8,.2,1) both}
.sp .wm{font-size:44px;animation:rise .5s .25s both}
.sp-tag{color:rgba(255,255,255,.7);font-size:15px;letter-spacing:.02em;animation:rise .5s .4s both}
.sp-bar{width:120px;height:3px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;animation:rise .4s .45s both}
.sp-bar i{display:block;height:100%;width:40%;border-radius:9px;background:var(--gold);animation:spLoad 1s ease-in-out infinite}
@keyframes spPop{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes spDrive{from{transform:translateX(-26px);opacity:0}to{transform:none;opacity:1}}
@keyframes spLoad{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){.sp-mark,.sp-mark svg,.sp .wm,.sp-tag,.sp-bar,.sp-bar i{animation:none}}
.empty .emk{width:44px;height:44px;border-radius:14px;margin:0 auto 10px;display:grid;place-items:center;background:var(--hivis-soft)}

/* ===== v7: route, quote ===== */
.flbl{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.route{position:relative;display:grid;grid-template-columns:auto minmax(40px,1fr) auto;align-items:center;gap:10px;padding:16px;border-radius:20px;background:var(--surface);box-shadow:0 1px 2px rgba(11,28,43,.05),0 10px 30px rgba(11,28,43,.07)}
.rpt{display:flex;gap:10px;align-items:center;min-width:0}.rpt.rb{justify-content:flex-end;text-align:right}
.rpt b{font-family:var(--display);font-size:18px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.rl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.ra,.rbb{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--display);font-style:normal;flex:none}
.ra{background:var(--navy2);color:#fff}.rbb{background:linear-gradient(145deg,#FFD35C,#F4B000);color:var(--navy)}
.rline{height:3px;background:repeating-linear-gradient(90deg,var(--gold) 0 8px,transparent 8px 14px);position:relative;border-radius:3px}
.rline span{position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap;background:var(--surface);padding:0 6px}
.rdir{grid-column:1/-1;justify-self:center}
.qgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qgrid>div{background:var(--surface-2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.qgrid span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.qgrid b{font-family:var(--display);font-size:24px}
.qgrid em{font-style:normal;font-size:12px;color:var(--ink-3)}
.qgrid .good{background:var(--ok-soft)}.qgrid .good b{color:var(--ok)}.qgrid .bad{background:var(--bad-soft)}.qgrid .bad b{color:var(--bad)}
@media (max-width:480px){.qgrid b{font-size:19px}.qgrid>div{padding:10px 8px}.qgrid em{font-size:11px}}
.findbar .seg+.seg{margin-left:0}
.who select,.mtop select{color-scheme:dark}
.who select option,.who select optgroup,.mtop select option,.mtop select optgroup{background:#13304A;color:#fff}
.who select optgroup,.mtop select optgroup{color:#F4B000;font-weight:700}

/* ===== v8: fewer white boxes, money ===== */
/* KPI rows become a stat strip on the navy band */
.page>.g-kpi:first-child,.page>.note:first-child+.g-kpi{gap:0;background:radial-gradient(80% 120% at 100% 0%,rgba(244,176,0,.18),rgba(244,176,0,0) 60%),linear-gradient(150deg,#13304A,#1C4B6E);border:1px solid rgba(244,176,0,.22);border-radius:20px;padding:6px 0;box-shadow:0 16px 36px rgba(3,12,20,.22)}
.page>.g-kpi:first-child>.kpi,.page>.note:first-child+.g-kpi>.kpi{background:transparent!important;box-shadow:none;border:0;border-radius:0;color:#fff;padding:12px 18px}
.page>.g-kpi:first-child>.kpi+.kpi,.page>.note:first-child+.g-kpi>.kpi+.kpi{border-left:1px solid rgba(255,255,255,.12)}
.page>.g-kpi:first-child .eyebrow,.page>.note:first-child+.g-kpi .eyebrow{color:var(--gold2)}

@media (max-width:760px){.page>.g-kpi:first-child>.kpi:nth-child(3),.page>.note:first-child+.g-kpi>.kpi:nth-child(3){border-left:0}.page>.g-kpi:first-child>.kpi:nth-child(n+3){border-top:1px solid rgba(255,255,255,.12)}}
/* list and table sections lose their white box */
.page section.card:has(.tablewrap),.page section.card:has(>.blist),.page section.card:has(>.list),.page .stack>section.card:has(.blist){background:transparent;box-shadow:none;border-radius:0;padding:6px 2px}
.page section.card:has(.tablewrap) .card-h h2,.page section.card:has(>.blist) .card-h h2,.page section.card:has(>.list) .card-h h2,.page section.card:has(>.list)>h2,.sech h2{display:flex;align-items:center;gap:10px}
.page section.card:has(.tablewrap) .card-h h2::before,.page section.card:has(>.blist) .card-h h2::before,.page section.card:has(>.list) .card-h h2::before,.sech h2::before{content:"";width:4px;height:20px;border-radius:4px;background:linear-gradient(180deg,#FFD35C,#F4B000)}
.page section.card:has(.tablewrap) tr.click td{background:transparent}
.page section.card:has(.tablewrap) tr.click:hover td{background:rgba(21,62,94,.05)}
.page section.card:has(.tablewrap) th{border-bottom:2px solid var(--line)}
.page section.card:has(>.blist) .brow,.page .stack>section.card:has(.blist) .brow{border-top:0;background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(11,28,43,.04)}
.page .only-m .ccard{background:var(--surface);border-radius:16px;padding:12px 14px;margin-bottom:8px;border-top:0}
/* tinted sections instead of plain white */
.page .stack>section.card:has(.att){background:linear-gradient(180deg,#FFF6DA,#FFFBEF);box-shadow:none;border:1px solid #F7DF95}

.sech{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.lrows{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;border:0;background:var(--surface);text-align:left;width:100%;cursor:pointer;box-shadow:0 1px 2px rgba(11,28,43,.05)}

.howbox .faint{color:rgba(255,255,255,.6)}
.cpaper .cl{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.cpaper .cl em{display:block;font-style:normal;font-size:12px;color:var(--ink-3)}
.cpaper .cl.tot{font-weight:700;font-size:17px;border-top:2px solid var(--ink)}
.cpay{border-radius:28px;padding:22px 20px;background:radial-gradient(90% 60% at 100% 0%,rgba(244,176,0,.25),rgba(244,176,0,0) 60%),linear-gradient(160deg,#0B1C2B,#16395A);color:#fff;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 44px rgba(3,12,20,.3)}
.cp-co{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-size:20px;font-weight:700}
.cp-mk{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#FFD35C,#F4B000);color:var(--navy);display:grid;place-items:center;font:700 14px var(--body)}
.cp-amt{font-family:var(--display);font-size:52px;font-weight:700;text-align:center;line-height:1;margin-top:4px}
.cp-lines{background:rgba(255,255,255,.07);border-radius:16px;padding:6px 14px}
.cp-lines>div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:14px}.cp-lines>div+div{border-top:1px solid rgba(255,255,255,.1)}
.cp-meth{display:flex;flex-direction:column;gap:8px}
.cpm{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);cursor:pointer}

.cpm input{accent-color:#F4B000;width:18px;height:18px}.cpm .small{opacity:.7}
.cp-foot{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;font-size:12px;opacity:.75}.cp-foot b i{font-style:normal;color:var(--gold)}
.cp-ok{width:84px;height:84px;border-radius:50%;margin:6px auto 0;display:grid;place-items:center;font:700 44px var(--display);background:#52C58E;color:#06291A;box-shadow:0 0 0 10px rgba(82,197,142,.18)}
.cpproc div{color:rgba(255,255,255,.55)}.cpproc div.on{color:#fff}.cpproc div.ok{color:#8EE3B5}

/* ===================== v9 · MIDNIGHT ===================== */
:root:not([data-theme="light"]):not(#_){color-scheme:dark;
  --bg:#07121C;--surface:#0E1C2A;--surface-2:#132536;--ink:#EAF0F5;--ink-2:#9FB1C2;--ink-3:#6F8497;--line:rgba(255,255,255,.07);
  --brand:#8DC1EE;--brand-ink:#07121C;--brand-soft:rgba(125,180,230,.12);
  --hivis:#F4B000;--hivis-ink:#07121C;--hivis-soft:rgba(244,176,0,.13);
  --ok:#6FD6A2;--ok-soft:rgba(82,197,142,.13);--warn:#F4B000;--warn-soft:rgba(244,176,0,.13);--bad:#FF8A78;--bad-soft:rgba(255,122,102,.13);
  --c0:#5AA9E0;--c1:#F08A4B;--c2:#4FB883;--c3:#A98BE6;--c4:#E57AA5;--c5:#3FB8B8;
  --display:"Manrope",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Manrope",system-ui,sans-serif;
  --eyebrow:#7F93A6;--navy:#07121C;--navy2:#0E1C2A;--shadow:none;--side:#07121C;--side-soft:rgba(255,255,255,.05)}
body,.app{background:var(--bg)}
body{font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased}
.num{font-family:var(--body);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.025em}
h2{font-size:19px}h3{font-size:16px}
.eyebrow{color:var(--eyebrow);font-weight:700;letter-spacing:.08em;font-size:11.5px}
/* shell */
.side{background:var(--bg);border-right:1px solid var(--line);padding:24px 14px}
.logo .mark{border-radius:12px}
.wm{font-family:var(--display);font-weight:700;letter-spacing:-.03em}
.who label{color:var(--ink-3);letter-spacing:.06em}
.who select,.mtop select{background:rgba(255,255,255,.05);border:1px solid var(--line);color:#fff;border-radius:12px}
.nav button{color:#7F93A6;font-weight:600;border-radius:12px}
.nav button:hover{background:rgba(255,255,255,.04);color:#fff}
.nav button[aria-current="page"]{background:rgba(244,176,0,.08);color:#fff;box-shadow:none}
.nav button[aria-current="page"] svg{color:var(--gold)}
.nav .badge,.bottomnav .badge{background:var(--gold);color:#07121C}
.bell{background:rgba(255,255,255,.05);border-color:var(--line);border-radius:50%}
.bell .badge{background:var(--gold);color:#07121C;border-color:var(--bg)}
.content{background:var(--bg)!important}
.content::before{right:-160px;top:-220px;width:620px;height:620px;background:radial-gradient(closest-side,rgba(244,176,0,.13),rgba(244,176,0,0))}
.content::after{display:none}
.phead{padding-top:34px}
.phead h1{font-size:30px;font-weight:800;letter-spacing:-.03em;color:#fff}
.phead .sub{color:var(--ink-3);font-weight:500}
.phead .btn:not(.go){background:rgba(255,255,255,.06);border-color:transparent}
/* surfaces: quiet, not white blocks */
.card{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:22px;box-shadow:none}
.card-h h2::before,.sech h2::before,.card>h2::before{display:none!important}
.page section.card:has(.tablewrap),.page section.card:has(>.blist),.page section.card:has(>.list),.page .stack>section.card:has(.blist){border:0;background:transparent;padding:4px 0}
.page .stack>section.card:has(.att){background:transparent;border:0;padding:4px 0}
.page section.card:has(>.blist) .brow,.page .stack>section.card:has(.blist) .brow{background:transparent;border-radius:0;box-shadow:none;margin:0;padding:14px 2px;border-top:1px solid var(--line)}
.page .blist .brow:first-child{border-top:0}
.card-h{margin-bottom:6px}
.card-h h2,.sech h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.card-h .btn.sm,.sech .btn.sm{background:transparent;border:0;color:var(--gold);padding:4px 0}
/* buttons */
.btn{background:rgba(255,255,255,.06);border:1px solid transparent;color:var(--ink);border-radius:14px;font-weight:700}
.btn:hover{border-color:rgba(255,255,255,.12)}
.btn.go,.btn.mega.go,.btn.ok,.hx .btn.mega.ok{background:#F4B000;border-color:#F4B000;color:#07121C;box-shadow:none}
.btn.go:hover,.btn.ok:hover{background:#FFC21F}
.btn.primary{background:#EAF0F5;border-color:#EAF0F5;color:#07121C}
.btn.ghost{background:transparent}
.btn.wa{background:#1FA855;color:#fff}
.btn.mega{border-radius:18px;min-height:58px;font-family:var(--display);font-size:17px;font-weight:800;letter-spacing:-.01em}
.btn.xl{font-family:var(--display);font-weight:800;border-radius:16px}
/* hero: no box, the number is the hero */
.hx{background:transparent!important;box-shadow:none!important;border:0;border-radius:0;padding:4px 0 0!important;gap:4px;overflow:visible}
.hx::after{display:none}
.hx-top{justify-content:flex-start;gap:10px}
.hx .lbl{color:var(--ink-3);letter-spacing:.02em;text-transform:none;font-size:14px;font-weight:600}
.hx .chip{background:rgba(255,255,255,.06);color:var(--ink-2);font-weight:700}
.hx .chip.bad{background:rgba(255,122,102,.14);color:#FF9C8C}.hx .chip.ok{background:rgba(82,197,142,.14);color:#7FE0B0}
.hx .big{font-family:var(--display);font-weight:800;font-size:clamp(50px,13vw,72px);letter-spacing:-.045em;color:#fff;margin:4px 0 0}
.hx-sub{color:var(--ink-2);font-size:14px}.hx-sub b{color:#FF9C8C}
.hx .btn.mega{max-width:420px;margin-top:16px}
.hx-stats{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-top:22px}
.hx-stats>div+div{border-left:1px solid var(--line)}
.hx-stats span{color:var(--ink-3);text-transform:none;letter-spacing:0;font-size:12px;opacity:1}
.hx-stats b{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.gbar{background:rgba(255,255,255,.07);height:6px}
/* action cards (crew) */
.act{background:linear-gradient(160deg,#122538,#0C1A28);border:1px solid var(--line);border-radius:24px;box-shadow:none}
.act .lbl,.act-top{color:var(--gold)}.act .lbl{font-size:11.5px;letter-spacing:.08em}
.act .when{font-family:var(--display);font-weight:800;letter-spacing:-.03em;font-size:32px}
.act.offerx{border-color:rgba(244,176,0,.3);background:linear-gradient(160deg,#152A3D,#0E1D2B)}
.act.sendx{border-color:rgba(244,176,0,.3)}
.act.live{background:linear-gradient(150deg,#0D4A2E,#136B43);border:0}
.act.live .lbl,.act.live .act-top{color:#fff}
.act .act-row .btn{background:rgba(255,255,255,.07)}
.paidbar{background:linear-gradient(150deg,#0D4A2E,#136B43);box-shadow:none;border-radius:20px}
.mini{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;padding:14px 2px}
.mini .mi-ic{background:rgba(244,176,0,.13);color:var(--gold);border-radius:14px;width:44px;height:44px}
.mini .mi-go{color:var(--gold)}
/* rows */
.att{border-top:1px solid var(--line);padding:13px 0;align-items:center}
.att .ic{width:44px;height:44px;border-radius:14px;font-size:13px}
.att .ic.r{background:rgba(255,122,102,.13);color:#FF8A78}.att .ic.a{background:rgba(244,176,0,.13);color:#F4B000}.att .ic.b{background:rgba(125,180,230,.12);color:#8DC1EE}
.att .btn.sm{background:rgba(255,255,255,.06)}.att .btn.sm.go{background:#F4B000}
.jc{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:14px 2px}
.stack>.jc:first-child{border-top:0}
.jc:hover{background:rgba(255,255,255,.02);border-color:var(--line)}
.jc .time{font-family:var(--display);font-weight:800;letter-spacing:-.03em;font-size:21px}
.lrow{background:transparent;border-radius:0;box-shadow:none;border-top:1px solid var(--line);padding:13px 2px}
.lrows .lrow:first-child{border-top:0}
.lrow:hover{box-shadow:none;background:rgba(255,255,255,.02)}
.lrow.warm{background:transparent}
.lic{background:rgba(125,180,230,.12);color:#8DC1EE;border-radius:14px;width:44px;height:44px}
.lic.go{background:rgba(244,176,0,.14);color:#F4B000}
.brow .av.sm{width:40px;height:40px;font-size:13px;border-radius:14px;border:0}
.only-m .ccard,.page .only-m .ccard{background:transparent;border-radius:0;border-top:1px solid var(--line);padding:14px 2px;margin:0}
/* kpi strip: hairlines, no box */
.page>.g-kpi:first-child,.page>.note:first-child+.g-kpi{background:transparent;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;padding:4px 0}
.page>.g-kpi:first-child>.kpi+.kpi,.page>.note:first-child+.g-kpi>.kpi+.kpi{border-left:1px solid var(--line)}
.page>.g-kpi:first-child>.kpi:nth-child(n+3){border-top-color:var(--line)}
.page>.g-kpi:first-child .eyebrow{color:var(--ink-3)}
.kpi .v{font-family:var(--display);font-weight:800;letter-spacing:-.03em}
.g-kpi .kpi{background:rgba(255,255,255,.025);border:1px solid var(--line);box-shadow:none}
/* tables */
th{color:var(--ink-3);border-bottom:1px solid var(--line)!important}
td{border-bottom:1px solid var(--line)}
.page section.card:has(.tablewrap) tr.click:hover td{background:rgba(255,255,255,.025)}
/* job board */
.task{background:linear-gradient(160deg,#112335,#0C1A28);border:1px solid var(--line);box-shadow:none}
.task:hover{border-color:rgba(244,176,0,.35);box-shadow:none}
.task::before{width:3px}
.tprice{color:var(--gold)!important;font-family:var(--display);font-weight:800;letter-spacing:-.03em}
.ttitle{font-family:var(--display);font-weight:800;letter-spacing:-.02em;font-size:19px}
.tco .cav{background:rgba(244,176,0,.14);color:var(--gold)}
.tfoot{border-top:1px solid var(--line)}
.tabs button{background:rgba(255,255,255,.05);color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:#F4B000;color:#07121C}
.tabs button i{background:rgba(255,255,255,.08);color:var(--ink-2)}
.tabs button[aria-pressed="true"] i{background:#07121C;color:#F4B000}
.seg{background:rgba(255,255,255,.05);border-color:transparent}
.seg button[aria-pressed="true"]{background:#EAF0F5;color:#07121C}
.search{background:rgba(255,255,255,.05);border-color:var(--line);box-shadow:none}
.chips button{background:rgba(255,255,255,.05);border-color:var(--line)}
.chips button[aria-pressed="true"]{background:#F4B000;border-color:#F4B000;color:#07121C}
.favbtn{background:rgba(255,255,255,.05);border-color:var(--line)}
.prof{background:rgba(255,255,255,.025);border-color:var(--line)}
.route{background:rgba(255,255,255,.025);border:1px solid var(--line);box-shadow:none}
.rline span{background:var(--bg)}
.ra{background:#EAF0F5;color:#07121C}
/* forms */
label.f input,label.f select,label.f textarea,.pickrow select{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:var(--ink);border-radius:12px;padding:11px 12px}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:0;border-color:#F4B000}
label.f{color:var(--ink-3)}
select option{background:#0E1C2A;color:#EAF0F5}
.note{background:rgba(255,255,255,.04);color:var(--ink-2);border-radius:14px}
.sendbox{background:rgba(255,255,255,.025);border:1px solid rgba(244,176,0,.3)}
.vis,.mopt,.opt,.pickrow{background:rgba(255,255,255,.03);border-color:var(--line)}
.vis:has(input:checked),.mopt:has(input:checked),.opt:has(input:checked){background:rgba(244,176,0,.08);border-color:rgba(244,176,0,.5)}
.pickrow[aria-pressed="true"]{background:rgba(244,176,0,.08);border-color:rgba(244,176,0,.5)}
.stepper{background:rgba(255,255,255,.04);border-color:var(--line)}.stepper button{color:#F4B000}
.daypick span{background:rgba(255,255,255,.04);border-color:var(--line)}
.daypick input:checked+span{background:#F4B000;border-color:#F4B000;color:#07121C}
.est,.howbox{background:linear-gradient(160deg,#152A3D,#0E1D2B);border:1px solid var(--line)}
.qgrid>div{background:rgba(255,255,255,.04)}
.cpaper{background:rgba(255,255,255,.025)}
/* drawer */
.scrim{background:rgba(2,8,14,.65)}
.drawer{background:#0A1724;border-left:1px solid var(--line)}
.dhead{background:rgba(10,23,36,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.dhead h2{font-size:19px}
.sticky{background:linear-gradient(transparent,#0A1724 30%)}
.checkout{background:rgba(255,255,255,.025);border-color:var(--line)}
.checkout .ch-h{background:linear-gradient(160deg,#152A3D,#0E1D2B)}
/* chat */
.msgs{background:rgba(255,255,255,.02)}.bub{background:rgba(255,255,255,.06);border-color:transparent}
.msg.mine .bub{background:#F4B000;color:#07121C;border-color:#F4B000}
.compose{background:transparent}.compose input{background:rgba(255,255,255,.05);border-color:var(--line)}
.thr[aria-current="true"]{background:rgba(244,176,0,.08)}
.invcard{background:rgba(255,255,255,.04);border-color:var(--line)}
/* schedule */
.bday{background:rgba(255,255,255,.02);border-color:var(--line)}
.bday.today{background:rgba(244,176,0,.05);border:1px solid rgba(244,176,0,.4)}
.bj{background:rgba(255,255,255,.04);border-color:var(--line)}
.addday{border-color:var(--line)}
/* pills */
.p-blue{background:rgba(125,180,230,.12);color:#8DC1EE}.p-grey{background:rgba(255,255,255,.06);color:var(--ink-2)}
.toast{background:#EAF0F5;color:#07121C;border-radius:14px}
.toast button{color:#9A6A00}
/* mobile chrome */
@media (max-width:900px){
  .mtop{background:rgba(7,18,28,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .phead{padding-top:22px}
  .page{padding-bottom:130px}
  .bottomnav{left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));border-radius:24px;background:rgba(20,34,48,.86)!important;backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.07);box-shadow:0 20px 40px rgba(0,0,0,.5);padding:8px 6px;align-items:center}
  .bottomnav button{color:#6D8295}

  .bottomnav button[aria-current="page"]{color:#F4B000}
  .bottomnav button[aria-current="page"] svg{background:none;color:#F4B000}
  .bottomnav .fab{color:#6D8295;font-size:0;gap:0}
  .bottomnav .fab .fb{width:52px;height:52px;border-radius:17px;margin:0;background:#F4B000!important;color:#07121C;box-shadow:0 8px 20px rgba(244,176,0,.3)!important}
  .bottomnav .fab.live .fb{background:#2FA66A!important;color:#fff}
  .toast{bottom:calc(104px + env(safe-area-inset-bottom,0px))}
}
#splash{background:radial-gradient(60% 50% at 50% 38%,rgba(244,176,0,.16),rgba(244,176,0,0) 70%),#07121C}

/* ===================== v10 · LIGHT THEME ===================== */
:root[data-theme="light"]:not(#_){color-scheme:light;
  --bg:#F5F3EE;--surface:#FFFFFF;--surface-2:#EFECE4;--ink:#0B1C2B;--ink-2:#4B5966;--ink-3:#7B8794;--line:rgba(11,28,43,.09);
  --brand:#1C4B6E;--brand-ink:#FFFFFF;--brand-soft:rgba(28,75,110,.08);
  --hivis:#F4B000;--hivis-ink:#0B1C2B;--hivis-soft:#FBEFC9;
  --ok:#1D7648;--ok-soft:#DDF1E6;--warn:#8A5E00;--warn-soft:#FBEFC9;--bad:#C23B22;--bad-soft:#FBE3DD;
  --c0:#1C6EA4;--c1:#C2571A;--c2:#2E8B57;--c3:#7B4BB7;--c4:#B8336A;--c5:#0F8A8A;
  --display:"Manrope",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Manrope",system-ui,sans-serif;
  --eyebrow:#8A6A1F;--navy:#0B1C2B;--navy2:#13304A;--shadow:0 1px 2px rgba(11,28,43,.05);--side:#0B1C2B;--side-soft:rgba(255,255,255,.06)}
html[data-theme="light"] .side{background:#0B1C2B;border-right:0}
html[data-theme="light"] .content::before{background:radial-gradient(closest-side,rgba(244,176,0,.10),rgba(244,176,0,0))}
html[data-theme="light"] .phead h1{color:var(--ink)}
html[data-theme="light"] .phead .btn:not(.go){background:rgba(11,28,43,.06);color:var(--ink)}
html[data-theme="light"] .page>.note:first-child{background:rgba(11,28,43,.05);color:var(--ink-2)}
html[data-theme="light"] .card,html[data-theme="light"] .g-kpi .kpi{background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(11,28,43,.04)}
html[data-theme="light"] .btn{background:rgba(11,28,43,.05);color:var(--ink)}

/* ===== v11: onboarding ===== */

/* ===================== v12 · clear sections, bold titles, button roles ===================== */
.page{gap:24px}
.grid{gap:20px}
/* every section is a panel: header strip + body */
.page section.card,.page .stack>section.card,.page section.card:has(.tablewrap),.page section.card:has(>.blist),.page section.card:has(>.list),.page .stack>section.card:has(.blist),.page .stack>section.card:has(.att){
  background:var(--panel);border:1px solid var(--panel-line);border-radius:22px;padding:0 18px 8px;box-shadow:var(--panel-shadow)}
.page .card>.card-h,.page .card>h2:first-child,.page .card>h3:first-child{margin:0 -18px 4px;padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.page .card>.card-h+*{margin-top:6px}
.page .card>.stack:first-child,.page .card>.board:first-child,.page .card>div:first-child:not(.card-h){margin-top:14px}
.page section.card.kpi,.page .g-kpi>.card{padding:16px 18px}
/* titles: big, bold, readable, gold marker */
.page .card-h h2,.page .card-h h3,.page .card>h2,.page .card>h3,.sech h2,.teaser .card-h h2{font-family:var(--display);font-size:19px!important;font-weight:800;letter-spacing:-.02em;text-transform:none!important;color:var(--ink)!important;display:flex;align-items:center;gap:10px}
.page .card-h h2::before,.page .card-h h3::before,.page .card>h2::before,.page .card>h3::before,.sech h2::before,.teaser .card-h h2::before{content:"";display:block!important;width:5px;height:20px;border-radius:5px;background:#F4B000;flex:none}
.page .card-h .eyebrow{display:block;margin-bottom:2px}
.page .card-h>div>h2::before{display:none!important}
.sech{margin:4px 2px -8px}
.lrows{background:var(--panel);border:1px solid var(--panel-line);border-radius:22px;padding:4px 16px;box-shadow:var(--panel-shadow)}
.lrows>.empty{padding:18px}
.teaser>.card-h{margin:0 2px 12px!important}
/* "needs you" gets a warm frame so it stands apart */
.page .stack>section.card:has(.att){background:var(--panel-warm);border-color:var(--panel-warm-line)}
.page .stack>section.card:has(.att) .card-h h2::before{background:#FF7A66}
/* section tints by purpose */
.page section.card:has(.lchip) .card-h h2::before{background:#52C58E}
/* rows inside panels */
.page .card .brow,.page .card .jc,.page .card .att,.lrow{border-top:1px solid var(--line)}
.page .card .blist>.brow:first-child,.page .card .stack>.jc:first-child,.page .card .att:first-of-type,.lrows>.lrow:first-child{border-top:0}
.page>.g-kpi:first-child,.page>.note:first-child+.g-kpi{background:var(--panel)!important;border:1px solid var(--panel-line)!important;border-radius:22px!important;padding:4px 0}
/* hero sits in its own clear zone */
.hx{padding-bottom:4px!important}
.hx-stats{margin-bottom:4px}
/* ---------- buttons by purpose ---------- */
.btn{background:transparent;border:1.5px solid var(--btn-line);color:var(--ink);font-weight:700}
.btn:hover{border-color:var(--ink-3);background:var(--btn-hover)}
.btn.go{background:#F4B000;border-color:#F4B000;color:#07121C}                       /* create / main action */
.btn.ok,.hx .btn.mega.ok,.btn.mega.ok{background:var(--pay);border-color:var(--pay);color:#fff}   /* money: pay, accept, paid */
.btn.ok:hover{background:var(--pay-h);border-color:var(--pay-h)}
.btn.primary{background:var(--solid);border-color:var(--solid);color:var(--solid-ink)}   /* confirm / save */
.btn.danger{border-color:rgba(255,122,102,.5);color:var(--bad);background:transparent}  /* cancel / delete */
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.card-h .btn.sm,.sech .btn.sm,.teaser .card-h .btn.sm{border:0;background:transparent;color:var(--link);font-weight:700;padding:4px 0}
.card-h .btn.sm::after,.teaser .card-h .btn.sm::after{content:" →"}
.btn.sm{border-width:1.5px}
.act .act-row .btn{border-color:rgba(255,255,255,.18);background:transparent;color:#EAF0F5}
/* ---------- tokens ---------- */
:root:not([data-theme="light"]){--panel:#0C1A27;--panel-line:rgba(255,255,255,.07);--panel-shadow:0 1px 0 rgba(255,255,255,.02) inset;--panel-warm:#1A1A14;--panel-warm-line:rgba(244,176,0,.28);
  --btn-line:rgba(255,255,255,.18);--btn-hover:rgba(255,255,255,.05);--pay:#2FA66A;--pay-h:#35B976;--solid:#EAF0F5;--solid-ink:#07121C;--link:#F4B000}

  --btn-line:rgba(11,28,43,.2);--btn-hover:rgba(11,28,43,.04);--pay:#1D7648;--pay-h:#1A6A41;--solid:#0B1C2B;--solid-ink:#FFFFFF;--link:#8A5E00}
/* ---------- light mode: no white text on light ---------- */
html[data-theme="light"] .hx,html[data-theme="light"] .hx-top,html[data-theme="light"] .hx-stats b{color:var(--ink)}
html[data-theme="light"] .hx-stats span{color:var(--ink-3)}

html[data-theme="light"] .page>.g-kpi:first-child .kpi.alert .v{color:var(--bad)}html[data-theme="light"] .page>.g-kpi:first-child .kpi.good .v{color:var(--ok)}
html[data-theme="light"] .page>.g-kpi:first-child,html[data-theme="light"] .page>.note:first-child+.g-kpi{background:#fff;border:1px solid var(--line);border-radius:22px}

<script>
// ================= helpers =================
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const toStr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayStr=()=>toStr(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return toStr(d)};
const weekStart=s=>{const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return toStr(d)};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fd=s=>{if(!s)return'';const d=parse(s);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
const fdl=s=>{const d=parse(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};
const fdt=iso=>{const d=new Date(iso);return d.getDate()+' '+MON[d.getMonth()]+', '+pad(d.getHours())+':'+pad(d.getMinutes())};
const dayLabel=s=>{const t=todayStr();return s===t?'Today':s===addDays(t,1)?'Tomorrow':s===addDays(t,-1)?'Yesterday':fd(s)};
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const money=n=>'$'+(Math.round((n||0)*100)/100).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>'$'+Math.round(n||0).toLocaleString('en-AU');
const r2=n=>Math.round(n*100)/100;
const hrs=h=>(Math.round(h*100)/100)+' h';
const fyOf=s=>{const d=parse(s);return d.getMonth()>=6?d.getFullYear()+1:d.getFullYear()};
const TOLLS='Tolls & parking';
const initials=n=>String(n||'?').replace(/\(.*?\)/g,'').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const mapsHref=a=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a+', NSW');
const firstName=n=>String(n||'').replace(/\(.*?\)/g,'').trim().split(' ')[0];

function tHours(a){
  if(!a||!a.in||!a.out)return 0;
  const [h1,m1]=a.in.split(':').map(Number),[h2,m2]=a.out.split(':').map(Number);
  let m=(h2*60+m2)-(h1*60+m1);if(m<0)m+=1440;m-=(+a.breakMins||0);return Math.max(0,m/60);
}
const tPay=a=>r2(tHours(a)*(+a.rate||0)+(+a.tolls||0));

// ================= state =================
const S={org:null,crew:{},jobs:{},invoices:{},expenses:{},chats:{},companies:{},links:{},notes:{},cinvoices:{},qreqs:{},customers:{},reviews:{}};
const UI={role:'company',coId:'org',crewId:null,thread:null,page:'dash',weekOf:weekStart(todayStr()),fy:fyOf(todayStr()),drawer:null,mper:'fy'};
let db=null,live=false,downloads=null,mcp=null,ready=false;
let THEME='dark';try{THEME=localStorage.getItem('crewbill.theme')||'dark'}catch(_){}
document.documentElement.dataset.theme=THEME;
let NAVMODE='dock';try{NAVMODE=localStorage.getItem('truckle.nav')||'dock'}catch(_){}document.documentElement.dataset.nav=NAVMODE;
try{const v=JSON.parse(localStorage.getItem('crewbill.view')||'null');if(v){UI.role=v.role;UI.crewId=v.crewId;UI.coId=v.coId||'org';UI.custKey=v.custKey||null}}catch(_){}
const CO_DEF={name:'',abn:'',email:'',phone:'',terms:7,jobPrefix:'J-',nextJob:1001,trucks:['4T truck','8T truck','10T truck']};
function company(id){if(!id||id==='org')return {...CO_DEF,...(S.org||{}),id:'org'};const c=S.companies[id];return c?{...CO_DEF,...c,id}:{...CO_DEF,name:'Company',id}}
const O=id=>company(id??(UI.role==='company'?UI.coId:'org'));
const isCo=k=>k==='org'||!!S.companies[k];
const coArr=()=>[company('org'),...Object.values(S.companies).filter(c=>!c.archived).map(c=>company(c.id))];
const linkId=(co,cid)=>co+'__'+cid;
const linkOf=(co,cid)=>S.links[linkId(co,cid)];
const rateFor=(co,cid)=>+(linkOf(co,cid)?.rate??S.crew[cid]?.rate??40);
const termsFor=(co,cid)=>+(linkOf(co,cid)?.terms??company(co).terms??7);
const allCrew=()=>Object.values(S.crew).filter(c=>!c.archived).sort((a,b)=>a.name.localeCompare(b.name));
function worksWith(co,cid){const c=S.crew[cid];if(!c)return false;if(linkOf(co,cid))return true;if(co==='org'&&!c.homeCo&&!c.setup)return true;return Object.values(S.jobs).some(j=>jobCo(j)===co&&j.crew&&j.crew[cid])}
const crewArr=()=>UI.role==='company'?allCrew().filter(c=>worksWith(UI.coId,c.id)):allCrew();
const coOfCrew=cid=>coArr().filter(c=>worksWith(c.id,cid));
const crewColor=id=>{const i=Object.values(S.crew).sort((a,b)=>a.name.localeCompare(b.name)).findIndex(c=>c.id===id);return `var(--c${(i<0?0:i)%6})`};
const crewName=id=>S.crew[id]?.name||'Unknown';
const me=()=>S.crew[UI.crewId];

// ================= persistence =================
function errText(e){return e&&e.code==='quota_exceeded'?'Storage is full. Delete some old entries and try again.':'Could not save. Check your connection and try again.'}
async function put(coll,id,data){if(data&&'id' in data){data={...data};delete data.id}
  if(live){try{await db.doc(coll+'/'+id).set(data);S[coll][id]={...data,id}}catch(e){toast(errText(e));throw e}}
  else{S[coll][id]={...data,id};render()}
}
function deepMerge(a,b){const o={...a};for(const k in b){o[k]=(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a&&typeof a[k]==='object'&&!Array.isArray(a[k]))?deepMerge(a[k],b[k]):b[k]}return o}
async function patch(coll,id,data){
  if(live){try{await db.doc(coll+'/'+id).update(data);if(S[coll][id])S[coll][id]=deepMerge(S[coll][id],data)}catch(e){toast(errText(e));throw e}}
  else{S[coll][id]=deepMerge(S[coll][id],data);render()}
}
async function del(coll,id){
  if(live){try{await db.doc(coll+'/'+id).delete();delete S[coll][id]}catch(e){toast(errText(e));throw e}}
  else{delete S[coll][id];render()}
}
async function saveOrg(data){
  const cur=O(),id=cur.id,next={...cur,...data};delete next.id;
  if(id==='org'){if(live){try{await db.doc('settings/org').set(next)}catch(e){toast(errText(e));throw e}}else{S.org=next;render()}}
  else await put('companies',id,next);
}
function subscribe(){
  const keys=['org','crew','jobs','invoices','expenses','chats','companies','links','notes','cinvoices','qreqs','customers','reviews'];const seen={};let n=0;
  const tick=k=>{if(k==='notes')noteArrived();if(!seen[k]){seen[k]=1;n++;if(n>=keys.length&&!ready){ready=true;fixView();seedSeen();UI.pageAnim=true;setTimeout(()=>checkNoCrew().catch(()=>{}),1500)}}render();refreshDrawer()};
  db.doc('settings/org').onSnapshot(s=>{S.org=s.exists?s.data():null;tick('org')},fail);
  for(const c of keys.slice(1))db.collection(c).onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]={...d.data(),id:d.id});S[c]=o;tick(c)},fail);
}
function fail(){toast('Lost connection to your data. Reload the page.')}

// ================= derived =================
const jobCo=j=>j.companyId||(j.clientId?null:'org');
const invCo=i=>i.companyId||(i.clientId?null:'org');
const payerKey=j=>j.clientId||jobCo(j);
function payerInfo(key,cid){
  if(!key||isCo(key)){const o=company(key||'org');return {key:o.id,name:o.name||'Company',email:o.email||'',phone:o.phone||'',abn:o.abn||'',terms:termsFor(o.id,cid||UI.crewId),onApp:true}}
  const c=((S.crew[cid||UI.crewId]||{}).clients||[]).find(x=>x.id===key)||{name:'Other company'};
  return {key,name:c.name,email:c.email||'',phone:c.phone||'',abn:c.abn||'',terms:c.terms??7,rate:c.rate,onApp:false};
}
const invPayer=inv=>payerInfo(inv.clientId||invCo(inv),inv.crewId);
const invList=()=>Object.values(S.invoices).filter(i=>UI.role!=='company'||(invCo(i)===UI.coId&&i.status!=='draft'));
const jobsArr=()=>Object.values(S.jobs).filter(j=>!j.cancelled&&(UI.role!=='company'||jobCo(j)===UI.coId)).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
const accepted=j=>Object.entries(j.crew||{}).filter(([,a])=>a.status==='accepted');
const jFlow=j=>j.flow||(j.quote?'quote':'booked');
function allocLock(j){if(!j||j.manual||j.clientId)return '';if(j.requested)return 'req';if(jFlow(j)!=='quote')return '';if(!j.quote)return 'noquote';if(j.quote.status!=='accepted')return j.quote.status==='declined'?'declined':'quote';return ''}
function allocMsg(j){const k=allocLock(j),n=firstName(j.customer)||'the customer';return k==='req'?`Confirm ${n}'s booking first. Then you can allocate crew.`:k==='declined'?`${n} declined this quote, so there's nothing to allocate.`:k==='quote'?`Waiting for ${n} to accept your quote. You can allocate crew once they accept.`:k==='noquote'?`This job is priced by quote. Send ${n} the quote below. Once they accept, you can allocate crew.`:''}
function jobState(j){
  const acc=accepted(j),crew=Object.values(j.crew||{});
  if(j.cancelled)return 'cancelled';
  if(acc.some(([,a])=>a.in&&!a.out))return 'live';
  if(acc.length&&acc.every(([,a])=>a.out))return 'done';
  {const lk=allocLock(j);if(lk)return lk==='declined'?'qdeclined':lk==='req'?'request':lk==='noquote'?'qtodo':'quote'}
  if(acc.length<(+j.crewNeeded||1))return 'unfilled';
  return 'ready';
}
const openSpots=j=>Math.max(0,(+j.crewNeeded||1)-accepted(j).length-Object.values(j.crew||{}).filter(a=>a.status==='offered').length);
function critJobs(co){const t=todayStr();return jobsArr().filter(j=>j.date===t&&!j.requested&&!j.cancelled&&jobState(j)==='unfilled'&&(!co||(jobCo(j)||'org')===co)).sort((a,b)=>(a.start||'').localeCompare(b.start||''))}
function startIn(j){const m=Math.round((new Date(j.date+'T'+(j.start||'00:00')).getTime()-Date.now())/60000);if(m<=0){const a=-m;return {late:true,txt:a<60?`Started ${a} min ago`:`Started ${Math.floor(a/60)} h ${a%60} min ago`}}return {late:false,soon:m<=120,txt:m<60?`Starts in ${m} min`:`Starts in ${Math.floor(m/60)} h ${m%60} min`}}
function critGap(j){const need=+j.crewNeeded||1,acc=accepted(j).length,off=Object.values(j.crew||{}).filter(a=>a.status==='offered').length;return `${need-acc} of ${need} crew missing${off?` · ${off} offer${off>1?'s':''} not answered`:''}${j.posted?' · on the job board':''}`}

function myShifts(cid){const out=[];for(const j of jobsArr()){const a=j.crew?.[cid];if(a)out.push({j,a})}return out}

function invStatus(inv){
  if(inv.status==='draft')return 'draft';
  if(inv.status==='paid')return 'paid';
  if(inv.dueAt&&inv.dueAt<todayStr())return 'overdue';
  return ['viewed','approved'].includes(inv.status)?inv.status:'sent';
}
const ISTATE={draft:['p-grey','Draft'],sent:['p-blue','Sent'],viewed:['p-blue','Viewed'],approved:['p-amber','Approved'],paid:['p-green','Paid'],overdue:['p-red','Overdue']};
const ipill=inv=>{const [c,l]=ISTATE[invStatus(inv)];return `<span class="pill ${c}">${l}</span>`};
function dueText(inv){
  if(inv.status==='draft')return 'not sent yet';
  if(inv.status==='paid')return 'paid '+fd(inv.paidAt);
  const d=daysBetween(todayStr(),inv.dueAt);
  return d>1?`due in ${d} days`:d===1?'due tomorrow':d===0?'due today':`${-d} day${d===-1?'':'s'} late`;
}
function groupPayer(sh){const g={};sh.forEach(x=>{(g[payerKey(x.j)]=g[payerKey(x.j)]||[]).push(x)});return Object.entries(g)}

function waNumber(ph){let n=String(ph||'').replace(/\D/g,'');if(n.startsWith('0'))n='61'+n.slice(1);return n}

function buildInvoice(cid,shifts){
  const c=S.crew[cid],key=payerKey(shifts[0].j),o=payerInfo(key,cid);
  const lines=[];
  shifts.forEach(({j,a})=>{
    const h=tHours(a);
    lines.push({date:j.date,desc:`${a.role||'Offsider'} · Job ${j.ref}${j.from||j.to?' · '+[j.from,j.to].filter(Boolean).join(' → '):''}`,detail:`${a.in}–${a.out}${+a.breakMins?` (${Math.round(a.breakMins)} min break)`:''}`,qty:r2(h),unit:'h',rate:+a.rate,amount:r2(h*(+a.rate))});
    if(+a.tolls)lines.push({date:j.date,desc:TOLLS,qty:1,unit:'',rate:+a.tolls,amount:r2(+a.tolls)});
  });
  const dates=shifts.map(s=>s.j.date).sort();
  const subtotal=r2(lines.reduce((s,l)=>s+l.amount,0)),gst=c.gst?r2(subtotal*0.1):0,issued=todayStr();
  return {id:uid(),number:(c.prefix||'INV-')+String(c.nextNumber||1).padStart(4,'0'),crewId:cid,
    toSnap:{name:o.name,abn:o.abn,email:o.email},clientId:key==='org'?null:key,
    fromSnap:{name:c.name,business:c.business||'',abn:c.abn||'',email:c.email||'',phone:c.phone||'',gst:!!c.gst,bsb:c.bsb||'',acct:c.acct||'',acctName:c.acctName||c.name,payid:c.payid||''},
    periodStart:dates[0],periodEnd:dates[dates.length-1],shifts:shifts.map(s=>s.j.id),lines,
    hours:r2(shifts.reduce((s,x)=>s+tHours(x.a),0)),subtotal,gst,total:r2(subtotal+gst),
    companyId:key!=='org'&&isCo(key)?key:null,
    status:'sent',issuedAt:issued,dueAt:addDays(issued,+(o.terms??7)),deliveries:[],
    history:[{t:new Date().toISOString(),what:'Invoice sent to '+(o.name||'company'),who:c.name}]};
}
// ---- drafts: the invoice builds itself as jobs finish ----
function draftShifts(inv){const out=[];(inv.shifts||[]).forEach(id=>{const j=S.jobs[id],a=j?.crew?.[inv.crewId];if(j&&a&&a.out)out.push({j,a})});return out.sort((x,y)=>(x.j.date+x.j.start).localeCompare(y.j.date+y.j.start))}
function draftBody(inv){
  const sh=draftShifts(inv);if(!sh.length)return null;
  const b=buildInvoice(inv.crewId,sh);
  const keep={id:inv.id,number:'',status:'draft',history:inv.history||[],createdAt:inv.createdAt||new Date().toISOString(),deliveries:[]};
  return {...b,...keep};
}
async function addToDraft(cid,jid){
  const j=S.jobs[jid],a=j?.crew?.[cid];if(!a||!a.out||a.invoiceId)return null;
  const pk=payerKey(j);
  let dr=draftsOf(cid).find(i=>(i.clientId||invCo(i))===pk);
  if(dr){const shifts=[...new Set([...(dr.shifts||[]),jid])];const nd=draftBody({...dr,shifts});await put('invoices',dr.id,nd);}
  else{const id=uid();const nd=draftBody({id,crewId:cid,shifts:[jid],history:[{t:new Date().toISOString(),what:'Draft created automatically from finished job',who:'Truckle'}]});await put('invoices',id,nd);dr={id}}
  await patch('jobs',jid,{crew:{[cid]:{invoiceId:dr.id}}});
  return dr.id;
}
async function refreshDraft(id){const inv=S.invoices[id];if(!inv||inv.status!=='draft')return;const nd=draftBody(inv);if(!nd){await del('invoices',id);return}
  if(JSON.stringify(nd.lines)!==JSON.stringify(inv.lines)||nd.total!==inv.total)await put('invoices',id,nd)}
async function removeFromDraft(id,jid){const inv=S.invoices[id];if(!inv)return;const shifts=(inv.shifts||[]).filter(x=>x!==jid);
  await patch('jobs',jid,{crew:{[inv.crewId]:{invoiceId:null}}});
  if(!shifts.length){await del('invoices',id);return 'gone'}
  await put('invoices',id,draftBody({...inv,shifts}))}
async function sendDraft(id,opts={}){
  const d0=S.invoices[id],c=S.crew[d0.crewId];const fresh=draftBody(d0);if(!fresh)throw new Error('empty');
  const p=invPayer(fresh),now=new Date().toISOString(),issued=todayStr();
  const inv={...fresh,number:(c.prefix||'INV-')+String(c.nextNumber||1).padStart(4,'0'),status:'sent',sentAt:now,issuedAt:issued,dueAt:addDays(issued,+(p.terms??7)),
    history:[...(d0.history||[]),{t:now,what:'Sent to '+p.name+(p.onApp?' in Truckle':''),who:c.name}]};
  await put('invoices',id,inv);
  await patch('crew',c.id,{nextNumber:(c.nextNumber||1)+1});
  if(p.onApp){await postMsg(chatKey(p.key,c.id),c.id,opts.note||`Hi, here's my invoice for ${fd(inv.periodStart)}${inv.periodEnd!==inv.periodStart?' to '+fd(inv.periodEnd):''}.`,{invoiceId:inv.id});
    await notify('company',p.key,'sent',`New invoice from ${firstName(c.name)} · ${money(inv.total)}`,`${inv.number} · ${hrs(inv.hours)} · due ${fd(inv.dueAt)}`,inv.id)}
  let email=null;if(opts.email)email=await emailInvoice(inv.id,'send',inv);
  return {inv,email};
}

const PAY={platformPct:0.005,platformCap:5,
  methods:{payto:{label:'PayTo',sub:'Straight from your business bank account. Approve once in your banking app.',fee:a=>Math.min(3.5,a*0.01+0.3),feeTxt:'1% + 30c, max $3.50'},

    card:{label:'Business card',sub:'Visa, Mastercard or Amex. Instant.',fee:a=>a*0.017+0.3,feeTxt:'1.7% + 30c'}}};
const platFee=a=>r2(Math.min(PAY.platformCap,a*PAY.platformPct));
function bizDays(s,n){let d=s;while(n>0){d=addDays(d,1);const w=parse(d).getDay();if(w!==0&&w!==6)n--}return d}
function payMethod(k){return k==='balance'?{label:'Truckle balance',sub:`Money your customers paid in. Available ${money(balanceOf(UI.coId))}.`,fee:()=>0,feeTxt:'No fee'}:PAY.methods[k]}
async function payInApp(id,method){
  const inv=S.invoices[id],co=O(),m=payMethod(method),now=new Date().toISOString();
  const proc=r2(m.fee(inv.total)),plat=platFee(inv.total),ref='pi_sim_'+uid();
  const eta=method==='becs'?bizDays(todayStr(),3):bizDays(todayStr(),method==='card'?1:1);
  const hist=[...(inv.history||[])];if(inv.status!=='approved')hist.push({t:now,what:'Approved',who:co.name});
  hist.push({t:now,what:`Paid in Truckle by ${m.label} (${ref})`,who:co.name});
  await patch('invoices',id,{status:'paid',paidAt:todayStr(),paidRef:ref,approvedAt:inv.approvedAt||now,
    payment:{via:'crewbill',method,label:m.label,processingFee:proc,platformFee:plat,charged:r2(inv.total+proc+plat),payout:inv.total,payoutEta:eta,ref,at:now,simulated:true},history:hist});
  const k=chatKey(invCo(inv),inv.crewId);
  await postMsg(k,'company',`Paid ${inv.number} · ${money(inv.total)} in Truckle · lands in your account ${fd(eta)}`,{kind:'paid'});
  await notify('crew',inv.crewId,'paid',`${co.name} paid you ${money(inv.total)}`,`${inv.number} · arriving in your account by ${fd(eta)}`,id);
  await notify('company',invCo(inv),'paid',`Payment sent · ${money(r2(inv.total+proc+plat))}`,`${inv.number} to ${crewName(inv.crewId)} · receipt ${ref}`,id);
}

async function notify(toKind,toId,kind,title,body,invId,jobId,extra){if(!toId)return;const id=uid();const self=toKind+':'+toId===viewerKey();if(self&&seenNoteIds)seenNoteIds.add(id);await put('notes',id,{...(extra||{}),toKind,toId,kind,title,body:body||'',invId:invId||null,jobId:jobId||null,t:new Date().toISOString(),read:self})}

const myNotes=()=>Object.values(S.notes).filter(n=>n.toKind+':'+n.toId===viewerKey()).sort((a,b)=>b.t.localeCompare(a.t));

async function checkOverdue(){
  if(!ready)return;checkNoCrew().catch(()=>{});const t=todayStr();
  for(const inv of Object.values(S.invoices)){
    if(inv.status==='paid'||inv.status==='draft'||!inv.dueAt||inv.dueAt>=t||inv.overdueAt)continue;
    const co=invCo(inv);
    await patch('invoices',inv.id,{overdueAt:new Date().toISOString(),history:[...(inv.history||[]),{t:new Date().toISOString(),what:'Overdue',who:'Truckle'}]});
    await notify('crew',inv.crewId,'overdue',`${inv.number} is overdue`,`${money(inv.total)} from ${invPayer(inv).name} was due ${fd(inv.dueAt)}`,inv.id);
    if(co)await notify('company',co,'overdue',`Overdue: ${inv.number} from ${firstName(crewName(inv.crewId))}`,`${money(inv.total)} was due ${fd(inv.dueAt)}`,inv.id);
  }
}

function stepper(inv){
  const st=invStatus(inv),order=['draft','sent','viewed','approved','paid'];
  const at={draft:inv.createdAt||inv.history?.[0]?.t,sent:inv.sentAt||(inv.issuedAt?inv.issuedAt+'T09:00:00':null),viewed:inv.viewedAt,approved:inv.approvedAt,paid:inv.paidAt?inv.paidAt+'T12:00:00':null};
  const reached=k=>{if(k==='draft')return true;if(inv.status==='draft')return false;if(k==='sent')return true;if(inv.status==='paid')return true;if(k==='viewed')return ['viewed','approved'].includes(inv.status)||!!inv.viewedAt;if(k==='approved')return inv.status==='approved';return false};
  const cur=inv.status==='paid'?'paid':order.filter(reached).slice(-1)[0];
  return `<div class="steps" role="list" aria-label="Invoice progress">${order.map(k=>{const r=reached(k);const cls=k==='paid'&&r?'done paid':k===cur&&k!=='paid'?'cur':r?'done':'';
    const lab={draft:'Draft',sent:'Sent',viewed:'Viewed',approved:'Approved',paid:'Paid'}[k];
    const when=r&&at[k]?(k==='paid'?fd(inv.paidAt):fdt(at[k])):'';
    return `<div class="st ${cls}" role="listitem"><i></i><span>${lab}</span><small>${when}</small></div>`}).join('')}</div>${st==='overdue'?`<div class="note" style="background:var(--bad-soft);color:var(--bad)"><b>Overdue.</b> Was due ${fd(inv.dueAt)}. ${UI.role==='company'?'Pay now to keep your crew happy.':'Both of you have been notified.'}</div>`:''}`;
}

function mcpMsg(e){
  switch(e&&e.code){
    case 'server_not_connected':return 'Gmail isn\'t connected. Add Gmail in claude.ai Settings → Connectors.';
    case 'needs_reauth':return 'Gmail needs reconnecting in claude.ai Settings → Connectors.';
    case 'selection_required':return 'Choose which Gmail account to use when asked, then try again.';
    case 'not_in_manifest':return 'Email is switched off for this page. Allow Gmail when asked.';
    case 'blocked_by_policy':case 'approval_required':return 'Your organisation blocks sending email from here.';
    case 'tool_error':return 'Gmail refused it: '+(e.message||'unknown reason');
    case 'server_unavailable':case 'upstream_error':return 'Gmail didn\'t answer. Check your Sent folder before trying again.';
    case 'not_granted':case 'capability_disabled':case 'capability_removed':return 'Email sending isn\'t available in this view.';
    default:return 'Email didn\'t send: '+(e&&e.message||'unknown error');
  }
}

<div style="border:1px solid #E1E6EB;border-top:5px solid #F4B000;padding:20px;border-radius:6px">
<table width="100%"><tr><td><div style="font-size:24px;font-weight:bold">${f.gst?'Tax invoice':'Invoice'}</div><div style="color:#5A6774">${esc(inv.number)}</div></td><td style="text-align:right;font-size:13px"><b>${esc(f.business||f.name)}</b><br>ABN ${esc(f.abn)}<br>${esc(f.phone)}<br>${esc(f.email)}</td></tr></table>
<p style="font-size:13px"><b>Bill to:</b> ${esc(c.name)}${c.abn?' · ABN '+esc(c.abn):''}<br>Issued ${fdl(inv.issuedAt)} · <b>Due ${fdl(inv.dueAt)}</b></p>
<table width="100%" style="border-collapse:collapse">${rows}
<tr><td colspan="4" style="text-align:right;padding:6px 8px">Subtotal</td><td style="text-align:right;padding:6px 8px">${money(inv.subtotal)}</td></tr>
${f.gst?`<tr><td colspan="4" style="text-align:right;padding:6px 8px">GST 10%</td><td style="text-align:right;padding:6px 8px">${money(inv.gst)}</td></tr>`:''}
<tr><td colspan="4" style="text-align:right;padding:8px;font-weight:bold;border-top:2px solid #15202B">Total</td><td style="text-align:right;padding:8px;font-weight:bold;border-top:2px solid #15202B">${money(inv.total)}</td></tr></table>
${!f.gst?'<p style="font-size:12px;color:#5A6774">Not registered for GST. No GST has been charged.</p>':''}
<div style="background:#F5F7F9;border-radius:6px;padding:12px;font-size:13px"><b>How to pay</b><br>${f.payid?'PayID: '+esc(f.payid)+'<br>':''}Account name: ${esc(f.acctName)}<br>BSB: ${esc(f.bsb)} &nbsp; Account: ${esc(f.acct)}<br>Reference: ${esc(inv.number)}</div></div>
<p style="font-size:14px">Thanks,<br>${esc(firstName(f.name))}</p></div>`;
  const text=`${intro}\n\n${inv.number} · ${money(inv.total)} · due ${fdl(inv.dueAt)}\n${inv.lines.map(l=>`${fd(l.date)}  ${l.desc}  ${money(l.amount)}`).join('\n')}\n\nPay to ${f.acctName}\nBSB ${f.bsb}  Acc ${f.acct}${f.payid?'\nPayID '+f.payid:''}\nRef ${inv.number}\n\nThanks, ${firstName(f.name)}`;
  return {subject,html,text};
}
async function emailInvoice(id,kind,fb){
  const inv=S.invoices[id]||fb;const to=(invPayer(inv).email||'').trim();
  if(!to)return {ok:false,msg:'No email saved for '+invPayer(inv).name};

  let tag='';
  if(forCrew){const a=j.crew[UI.crewId];const s=aState(a);cls=s==='offered'?'offer':s==='live'?'live':s==='done'?'done':'';
    tag=s==='offered'?'<span class="pill p-amber">Offer</span>':s==='live'?'<span class="pill p-green">On the job</span>':s==='done'?(a.invoiceId?`<span class="pill ${S.invoices[a.invoiceId]?.status==='paid'?'p-green':'p-blue'}">${S.invoices[a.invoiceId]?.status==='paid'?'Paid':'Invoiced'}</span>`:'<span class="pill p-amber">To invoice</span>'):'<span class="pill p-blue">Booked</span>';

function monthChart(invs,fy){

// ================= celebrate =================
function celebrate(kind){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const box=document.createElement('div');box.className='cele '+kind;box.setAttribute('aria-hidden','true');
  const cols=kind==='paid'?['#1D7648','#52C58E','#F4B000','#FFFFFF']:['#F4B000','#1C4B6E','#79AEDA','#FFFFFF'];
  let h=`<div class="cele-badge">${kind==='paid'?'$':'✓'}</div>`;
  for(let k=0;k<26;k++){const ang=Math.random()*Math.PI*2,dist=90+Math.random()*170;h+=`<i style="--x:${Math.cos(ang)*dist}px;--y:${Math.sin(ang)*dist-40}px;--r:${Math.random()*540-270}deg;background:${cols[k%cols.length]};animation-delay:${Math.random()*80}ms"></i>`}
  box.innerHTML=h;document.body.appendChild(box);setTimeout(()=>box.remove(),1300);
}

   <section class="card"><div class="card-h"><h3>Leaderboard</h3><span class="small muted">All time</span></div><div class="lb">${board.slice(0,10).map((x,i)=>{const l=lvOf(x.xp,kind);return `<div class="${x.k===id?'me':''}"><span class="lb-n ${i<3?'p'+(i+1):''}">${i+1}</span><span class="lb-a">${esc(initials(nm(x.k)))}</span><b>${esc(nm(x.k))}${x.k===id?' <em>You</em>':''}</b>${lvBadge(l.lv,'sm')}<span class="num lb-x">${x.xp.toLocaleString('en-AU')}</span></div>`}).join('')}${pos>10?`<div class="me"><span class="lb-n">${pos}</span><span class="lb-a">${esc(initials(nm(id)))}</span><b>${esc(nm(id))} <em>You</em></b>${lvBadge(L.lv,'sm')}<span class="num lb-x">${X.xp.toLocaleString('en-AU')}</span></div>`:''}</div></section>
   <section class="card"><div class="card-h"><h3>Where your kms come from</h3></div><div class="xpl">${X.parts.map(([l,v,how])=>`<div><span>${esc(l)}<small>${esc(how)}</small></span><b class="num">${v?'+'+v.toLocaleString('en-AU')+' km':'0 km'}</b></div>`).join('')}</div></section>
   <section class="card"><div class="card-h"><h3>How to earn more kms</h3></div><div class="xpl">${earn.map(([l,v])=>`<div><span>${esc(l)}</span><b class="num up">${v} km</b></div>`).join('')}</div><div class="small muted" style="margin-top:8px">${kind==='crew'?'Companies see your truck class when you apply. Bigger trucks get picked first.':'Customers see your truck class next to your name when they compare removalists.'}</div></section>`}}
const CLASS_OFF={7:5,8:10,9:15,10:20};
function refCode(kind,id){let h=0;for(const ch of kind+id)h=(h*31+ch.charCodeAt(0))>>>0;return 'TRK-'+h.toString(36).toUpperCase().slice(-5).padStart(5,'7')}
function refsOf(kind,id){return (kind==='crew'?S.crew[id]?.refs:company(id).refs)||[]}
function refJoined(r){const n=String(r.name||'').trim().toLowerCase();return !!n&&(allCrew().some(c=>c.name.toLowerCase()===n)||coArr().some(o=>String(o.name||'').toLowerCase()===n))}
function rewardsOf(kind,id){const X=xpOf(kind,id),L=lvOf(X.xp,kind),cls=CLASS_OFF[L.lv]||0,leg=X.badges.filter(b=>b[4]&&b[3]).length,pct=Math.min(50,cls+leg*5);
  const refs=kind==='crew'?refsOf(kind,id):[],joined=refs.filter(refJoined).length;return {X,L,cls,leg,pct,refs,joined,code:refCode(kind,id)}}
function rewardsBar(kind,id){const W=rewardsOf(kind,id);return `<button class="rwbar" data-act="rewardsOpen" data-kind="${kind}" data-id="${id}"><span class="rw-i"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="9" width="17" height="11.5" rx="1.5"/><path d="M2.5 9h19V6.5h-19zM12 6.5v14M12 6.5C10 3 6.5 3 6.5 5s3 1.5 5.5 1.5M12 6.5C14 3 17.5 3 17.5 5s-3 1.5-5.5 1.5"/></svg></span><span class="grow"><b>${W.pct?W.pct+'% off your Truckle plan':'Unlock discounts on your plan'}</b><small>${kind==='company'?'Hit hard milestones to cut your plan price, up to 50% off':(W.joined?W.joined+' free month'+(W.joined>1?'s':'')+' from referrals · ':'')+'Refer someone and you both get a month free'}</small></span><span class="rw-go">Rewards ›</span></button>`}
function rewardsView(d){const kind=d.kind,id=d.id,W=rewardsOf(kind,id),link=location.href.split(/[?#]/)[0]+'?ref='+W.code;
  const wa='https://wa.me/?text='+encodeURIComponent(`I'm using Truckle to ${kind==='crew'?'find removal work and get paid faster':'run my removal jobs, crew and invoices'}. Sign up with my code ${W.code} and we both get a month free: ${link}`);
  const steps=[[7,'Pantech class',5],[8,'Semi class',10],[9,'B-Double class',15],[10,'Road Train class',20]];
  return {title:'Rewards',body:`<section class="rwhero"><div class="rwh-l">Your discount</div><div class="rwh-n num">${W.pct}%<small> off</small></div><div class="rwh-s">on your Truckle plan${W.joined?` · plus ${W.joined} free month${W.joined>1?'s':''}`:''}</div><div class="rwh-cap">Up to 50% off, for as long as you keep your class and badges</div></section>
   ${kind!=="crew"?`<section class="card"><div class="card-h"><h3>How companies save</h3></div><p class="muted" style="margin:0">Discounts come from milestones only. Grow your fleet class and earn Legendary badges. Each one takes more off your plan, up to 50%.</p></section>`:`<section class="card"><div class="card-h"><h3>Refer & get a month free</h3></div><p class="muted" style="margin:0 0 12px">When someone signs up with your code and finishes their first month, you both get a month free. No limit.</p>
    <div class="rcode"><span>Your code</span><b class="num">${W.code}</b></div>
    <div class="row" style="margin-top:12px"><a class="btn wa" href="${wa}" target="_blank" rel="noopener">Share on WhatsApp</a><button class="btn" data-act="refCopy" data-v="${esc(link)}">Copy link</button></div>
    <div class="form" style="margin-top:14px"><label class="f"><span>Their name or company</span><input id="rf_name" placeholder="e.g. Sam Lee Removals"></label><label class="f"><span>Their mobile</span><input id="rf_phone" type="tel" placeholder="04xx xxx xxx"></label></div>
    <button class="btn go" style="margin-top:10px" data-act="refAdd" data-kind="${kind}" data-id="${id}">Send invite</button>
    ${W.refs.length?`<div class="xpl" style="margin-top:14px">${W.refs.slice().reverse().map(r=>`<div><span>${esc(r.name)}<small>Invited ${fd(r.at.slice(0,10))}${r.phone?' · '+esc(r.phone):''}</small></span><b class="${refJoined(r)?'up':''}">${refJoined(r)?'Joined · 1 month free':'Invited'}</b></div>`).join('')}</div>`:''}</section>`}
   <section class="card"><div class="card-h"><h3>Grow your truck class</h3><span class="small muted">You're a ${esc(W.L.name)}</span></div><div class="xpl">${steps.map(([lv,l,o])=>`<div><span>${l}<small>${(LV_T[lv-1]).toLocaleString('en-AU')} km</small></span><b class="${W.L.lv>=lv?'up':''}">${W.L.lv>=lv?'✓ ':''}${o}% off</b></div>`).join('')}</div></section>
   <section class="card"><div class="card-h"><h3>Legendary badges</h3><span class="small muted">${W.leg} of 5 · +5% each</span></div><div class="bdg leg">${W.X.badges.filter(b=>b[4]).map(badgeTile).join('')}</div></section>`}}
function checkLevelUp(){try{const kind=UI.role==='crew'?'crew':UI.role==='company'?'company':null,id=kind==='crew'?UI.crewId:UI.coId;if(!kind||!id||!ready)return;const L=lvOf(xpOf(kind,id).xp,kind),k='truckle.lv.'+kind+'.'+id,old=+localStorage.getItem(k)||0;
  if(old&&L.lv>old){celebrate('paid');toast(`Upgrade! You're now driving a ${L.name} 🚚`)}localStorage.setItem(k,L.lv)}catch(_){}}
{const _h=PAGES.home[1];PAGES.home[1]=function(){const r=_h();if(me())r.body=levelCard('crew',UI.crewId)+rewardsBar('crew',UI.crewId)+r.body;return r};
 const _d=PAGES.dash[1];PAGES.dash[1]=function(){const r=_d();r.body=levelCard('company',UI.coId)+rewardsBar('company',UI.coId)+r.body;return r};
 const _r=render;render=function(){_r();{const c=document.querySelector('#main > .crit'),m=$('#main');if(c&&m.firstElementChild!==c)m.prepend(c)}document.documentElement.classList.toggle('dl',!!UI.drawer);checkLevelUp()}}
// ================= boot =================
render();
(async()=>{
  const c=window.claude,use=n=>c&&c.use?c.use(n).catch(()=>null):Promise.resolve(null);
  db=await use('db');
  if(db){live=true;subscribe()}else{ready=true;seedSeen();UI.pageAnim=true;render()}
  downloads=await use('downloads');
  mcp=await use('mcp');
})();
